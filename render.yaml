# Render Blueprint: deploys the backend API and a managed PostgreSQL database.
# Render dashboard -> New -> Blueprint -> select this repository.
# The frontend is deployed separately on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: nosh-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci
    # Applies migrations and inserts any missing seed dishes (never overwrites edits), then starts the API.
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nosh-db
          property: connectionString # internal URL, no SSL needed
      - key: DATABASE_SSL
        value: "false"
      # Your Vercel URL, e.g. https://nosh-dashboard.vercel.app (comma-separate several). Set in the Render dashboard.
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: nosh-db
    plan: free
    region: singapore
    databaseName: nosh
    user: nosh
